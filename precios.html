<!DOCTYPE html>
<html lang="es">
    <head>

        <meta charset="UTF-8">
        
        <title>Precios</title>

        <style>

            table {
                border-collapse: collapse;
            }

            th,td{
                border: 1px solid black;
                padding: 8px;
            }

        </style>

    </head>

    <body>
        <h2>Precios de Entradas</h2>

        <table>

            <tr>
                <th>Tipo de Entradas</th>
                <th>Precio</th>
                <th>Descripción</th>
            </tr>

            <tr>
                <td>Adultos</td>
                <td>10€</td>
                <td>Entrada para mayores de 18 años</td>
            </tr>

            <tr>
                <td>Niños</td>
                <td>5€</td>
                <td>Entrada para niños entre 6 y 17 años</td>
            </tr>

        </table>

        <p>Los precios pueden variar en eventos especiales.</p>
    </body>

</html>
